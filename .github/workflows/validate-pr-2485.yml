name: Validate PR 2485 head

on:
  push:
    branches:
      - validate-2485

permissions:
  contents: read

jobs:
  pagedraw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59599f5770ad0145d0ee14e79f72423bdf15b080
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build pagedraw library
        run: npx vite build --config libs/components/pagedraw/vite.config.ts
      - name: Run pagedraw tests
        run: npx vitest run --config libs/components/pagedraw/vite.config.ts
